name: klinik_asistan
description: Diş hekimi asistanı için hızlı seans notu ve fotoğraf uygulaması.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  uuid: ^4.5.1
  record: ^7.1.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  pdf: ^3.13.1
  firebase_crashlytics: 4.3.10
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # PDF dışa aktarma (Türkçe karakterler; SIL Open Font License)
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf

# Uygulama ikonu: 1024x1024 PNG'leri assets/icon/ altına koyup
#   dart run flutter_launcher_icons
# çalıştırın. iOS ikonu saydam olmamalı; Android adaptive ön plan ikonu
# saydam olmalı (araç kenarlara kendisi %16 boşluk ekler).
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  adaptive_icon_background: "#2B5C7A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
